<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Maru Online — Homepage</title>
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--color-bg-canvas); }

  /* Responsive grids — mobile-first (single column at 360px) */
  .maru-grid-4 { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .maru-grid-3-flush { display: grid; grid-template-columns: 1fr; gap: 1px; }
  .maru-grid-2 { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .maru-assess-grid { display: grid; grid-template-columns: 1fr; gap: 40px; align-items: start; }

  @media (min-width: 700px) {
    .maru-grid-4 { grid-template-columns: repeat(2, 1fr); }
    .maru-grid-2 { grid-template-columns: repeat(2, 1fr); }
    .maru-grid-3-flush { grid-template-columns: repeat(3, 1fr); }
  }
  @media (min-width: 1000px) {
    .maru-grid-4 { grid-template-columns: repeat(4, 1fr); gap: 24px; }
    .maru-assess-grid { grid-template-columns: repeat(2, 1fr); gap: 64px; }
  }

  /* Header responsive: hide desktop links + CTA on small, show burger */
  @media (max-width: 860px) {
    .maru-nav-links, .maru-nav-cta { display: none !important; }
    .maru-nav-burger { display: flex !important; }
  }
  @media (max-width: 720px) {
    .maru-footer-grid { grid-template-columns: 1fr 1fr !important; }
  }
  @media (max-width: 460px) {
    .maru-footer-grid { grid-template-columns: 1fr !important; }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" src="Header.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="Homepage.jsx"></script>
<script type="text/babel">
  const { WhatsAppButton } = window.MaruOnlineDesignSystem_422da4;
  function App() {
    return (
      <React.Fragment>
        <window.MaruHeader />
        <window.MaruHomepage />
        <window.MaruFooter />
        <WhatsAppButton variant="fab" message="Hi Maru, I'd like a free operations assessment." />
      </React.Fragment>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
