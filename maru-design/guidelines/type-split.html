<!-- @dsCard group="Type" viewport="700x230" name="Split headline & numerals" subtitle="Signature light+strong lockup; numerals are a brand asset" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--color-bg-primary);padding:24px;display:flex;gap:32px;align-items:center;}
  .meta{font-family:var(--font-body);font-size:10px;color:var(--color-ink-tertiary);letter-spacing:0.04em;margin-bottom:10px;}
  .nums{display:flex;gap:20px;}
  .num{font-family:var(--font-display);font-weight:600;font-size:40px;color:var(--color-cyan);letter-spacing:-0.02em;line-height:1;}
</style></head>
<body>
  <div style="flex:1">
    <div class="meta">SPLIT HEADLINE · weight 100 + 500</div>
    <h2 class="maru-headline-split" style="font-size:30px;margin:0;border:none;padding:0;color:var(--color-navy)">
      <span class="maru-headline-split-light">You're paying for 312 hours</span><br>
      <span class="maru-headline-split-strong">of Busywork Every Year.</span>
    </h2>
  </div>
  <div style="flex:1">
    <div class="meta">NUMERALS — OUTFIT · brand asset</div>
    <div class="nums"><span class="num">Free</span><span class="num">24h</span><span class="num">30</span><span class="num">R7,500</span></div>
  </div>
</body></html>
