<!-- @dsCard group="Spacing" viewport="700x220" name="Spacing scale" subtitle="4px base step, mobile-first" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--color-bg-primary);font-family:var(--font-body);padding:24px;}
  .row{display:flex;align-items:center;gap:14px;margin-bottom:9px;}
  .bar{height:16px;background:var(--color-cyan);border-radius:3px;}
  .lab{font-size:11px;color:var(--color-ink-secondary);min-width:140px;}
  .v{font-family:var(--font-display);font-size:11px;color:var(--color-ink-tertiary);}
</style></head>
<body>
  <div class="row"><span class="lab">--space-2</span><span class="bar" style="width:8px"></span><span class="v">8px</span></div>
  <div class="row"><span class="lab">--space-4</span><span class="bar" style="width:16px"></span><span class="v">16px</span></div>
  <div class="row"><span class="lab">--space-5</span><span class="bar" style="width:24px"></span><span class="v">24px</span></div>
  <div class="row"><span class="lab">--space-6</span><span class="bar" style="width:32px"></span><span class="v">32px</span></div>
  <div class="row"><span class="lab">--space-7</span><span class="bar" style="width:40px"></span><span class="v">40px</span></div>
  <div class="row"><span class="lab">--space-9</span><span class="bar" style="width:64px"></span><span class="v">64px</span></div>
  <div class="row"><span class="lab">--space-10</span><span class="bar" style="width:96px"></span><span class="v">96px</span></div>
</body></html>
