<!-- @dsCard group="Colors" viewport="700x190" name="Backgrounds" subtitle="Canvas, surfaces and the navy range" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--color-bg-canvas);font-family:var(--font-body);padding:22px;}
  .row{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;}
  .sw{border-radius:8px;height:78px;border:1px solid var(--color-border-default);}
  .lab{margin-top:8px;font-size:11px;color:var(--color-ink-secondary);}
  .hex{font-size:10px;color:var(--color-ink-tertiary);font-family:var(--font-display);letter-spacing:0.02em;}
</style></head>
<body>
  <div class="row">
    <div><div class="sw" style="background:var(--color-bg-canvas)"></div><div class="lab">Canvas</div><div class="hex">#FAFAF8</div></div>
    <div><div class="sw" style="background:var(--color-bg-primary)"></div><div class="lab">White</div><div class="hex">#FFFFFF</div></div>
    <div><div class="sw" style="background:var(--color-bg-secondary)"></div><div class="lab">Secondary</div><div class="hex">#F5F4F0</div></div>
    <div><div class="sw" style="background:var(--color-bg-tertiary)"></div><div class="lab">Tertiary</div><div class="hex">#EEEDE8</div></div>
    <div><div class="sw" style="background:var(--color-bg-navy)"></div><div class="lab">Navy</div><div class="hex">#1A3A5C</div></div>
    <div><div class="sw" style="background:var(--color-bg-navy-deep)"></div><div class="lab">Navy deep</div><div class="hex">#0D1B2A</div></div>
    <div><div class="sw" style="background:var(--color-bg-darkest)"></div><div class="lab">Darkest</div><div class="hex">#060E15</div></div>
  </div>
</body></html>
