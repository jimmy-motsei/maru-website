<!-- @dsCard group="Colors" viewport="700x230" name="Accents — Cyan & Gold" subtitle="Cyan = interactive · Gold = credential only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--color-bg-canvas);font-family:var(--font-body);padding:22px;}
  .grp{margin-bottom:16px;}
  .role{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--color-ink-tertiary);margin-bottom:10px;}
  .row{display:flex;gap:10px;}
  .sw{flex:1;border-radius:8px;height:62px;display:flex;align-items:flex-end;padding:8px;box-sizing:border-box;}
  .t{font-size:10px;font-family:var(--font-display);}
</style></head>
<body>
  <div class="grp">
    <div class="role">Cyan — the only interactive accent (buttons, links, focus, active)</div>
    <div class="row">
      <div class="sw" style="background:var(--color-cyan)"><span class="t" style="color:#0D1B2A">Cyan #3DB8C6</span></div>
      <div class="sw" style="background:var(--color-cyan-dark)"><span class="t" style="color:#fff">Dark #2DA8B6</span></div>
      <div class="sw" style="background:var(--color-cyan-light)"><span class="t" style="color:#2DA8B6">Light #E8F8FA</span></div>
    </div>
  </div>
  <div class="grp">
    <div class="role">Gold — credential register only (proof, results, POPIA) · never a button</div>
    <div class="row">
      <div class="sw" style="background:var(--color-gold)"><span class="t" style="color:#3a2e0c">Gold #CDAA53</span></div>
      <div class="sw" style="background:var(--color-gold-antique)"><span class="t" style="color:#fff">Antique #B8860B</span></div>
      <div class="sw" style="background:var(--color-gold-light);border:1px solid var(--color-gold-border)"><span class="t" style="color:#B8860B">Light #FDF8EE</span></div>
      <div class="sw" style="background:var(--color-whatsapp)"><span class="t" style="color:#fff">WhatsApp #25D366</span></div>
    </div>
  </div>
</body></html>
