<!-- @dsCard group="Brand" viewport="700x220" name="Logo" subtitle="The maru wordmark + cyan cloud mark, on light and navy" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;font-family:var(--font-body);display:grid;grid-template-columns:1fr 1fr;}
  .pane{padding:32px;display:flex;flex-direction:column;gap:14px;justify-content:center;align-items:center;}
  .light{background:var(--color-bg-primary);}
  .dark{background:var(--color-bg-navy-deep);}
  .cap{font-size:10px;letter-spacing:0.1em;text-transform:uppercase;}
  img{height:46px;width:auto;}
</style></head>
<body>
  <div class="pane light"><img src="../assets/brand/maru-logo.png" alt="Maru logo" /><span class="cap" style="color:var(--color-ink-tertiary)">On light</span></div>
  <div class="pane dark"><img src="../assets/brand/maru-logo.png" alt="Maru logo" style="filter:brightness(0) invert(1)" /><span class="cap" style="color:rgba(250,250,248,0.6)">On navy (invert)</span></div>
</body></html>
